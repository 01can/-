const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const batch=document.getElementById('fbatch').value, law=document.getElementById('flaw').value;
  const list=DATA.filter(r=>{
    if(batch&&r.batch!==batch)return false;
    if(law&&r.law!==law)return false;
    if(q){const hay=[r.no,r.batch,r.law,r.topic,r.trap,r.correct,r.memo].join(' ').toLowerCase();if(hay.indexOf(q)<0)return false;}
    return true;
  });
  const out=document.getElementById('out');
  if(!list.length){out.innerHTML='<div class="empty">没有符合条件的错题</div>';return;}
  let h='';
  ['第一批','第二批'].forEach(B=>{
    const sub=list.filter(r=>r.batch===B); if(!sub.length)return;
    h+='<div class="batchsec"><h2>'+B+' · 题'+(B==='第一批'?'1–100':'101–320')+' <span class="pill'+(B==='第二批'?' b2':'')+'">'+sub.length+' 题</span></h2>';
    const byLaw={};
    sub.forEach(r=>{(byLaw[r.law]=byLaw[r.law]||{})[r.topic]=(byLaw[r.law][r.topic]||[]).concat(r)});
    Object.keys(byLaw).forEach(L=>{
      h+='<h3>'+esc(L)+'</h3>';
      Object.keys(byLaw[L]).forEach(T=>{
        h+='<div style="color:var(--sub);font-size:13px;margin:10px 0 4px">└ '+esc(L)+'——'+esc(T)+'</div>';
        h+='<table><thead><tr><th style="width:60px">题号</th><th>错误原因（挖坑点/犯错点）</th><th style="width:90px">正确选项</th><th>记忆重点</th></tr></thead><tbody>';
        byLaw[L][T].sort((a,b)=>a.no-b.no).forEach(r=>{
          h+='<tr><td class="q">'+esc(r.no)+'</td><td>'+esc(r.trap)+'</td><td class="correct">'+esc(r.correct)+'</td><td>'+esc(r.memo)+'</td></tr>';
        });
        h+='</tbody></table>';
      });
    });
    h+='</div>';
  });
  out.innerHTML=h;
}
document.getElementById('q').addEventListener('input',render);
document.getElementById('fbatch').addEventListener('change',render);
document.getElementById('flaw').addEventListener('change',render);
render();
</script>
